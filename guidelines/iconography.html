<!-- @dsCard group="Brand" viewport="700x160" name="Iconography" subtitle="Lucide icon set (CDN) — outline, 1.5px stroke, no fill" -->
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<div style="display:flex;gap:16px;height:110px;align-items:center;font-family:var(--font-body);color:var(--text-muted);font-size:11px">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i data-lucide="layout-dashboard" style="width:26px;height:26px;color:var(--navy-800)"></i>dashboard</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i data-lucide="file-text" style="width:26px;height:26px;color:var(--navy-800)"></i>file-text</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i data-lucide="receipt" style="width:26px;height:26px;color:var(--navy-800)"></i>receipt</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i data-lucide="message-circle" style="width:26px;height:26px;color:var(--navy-800)"></i>chat</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i data-lucide="settings" style="width:26px;height:26px;color:var(--navy-800)"></i>settings</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i data-lucide="trending-up" style="width:26px;height:26px;color:var(--sky-500)"></i>growth</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i data-lucide="check" style="width:26px;height:26px;color:var(--success)"></i>check</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i data-lucide="bell" style="width:26px;height:26px;color:var(--navy-800)"></i>bell</div>
</div>
<script>lucide.createIcons();</script>
