<!-- @dsCard group="Colors" viewport="700x110" name="Semantic Colors" subtitle="Success, warning, danger, info states" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;font-family:var(--font-body);height:80px">
<div style="flex:1;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600;font-size:14px">Success</div>
<div style="flex:1;background:var(--warning-bg);color:#8a611b;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600;font-size:14px">Warning</div>
<div style="flex:1;background:var(--danger-bg);color:var(--danger);display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600;font-size:14px">Danger</div>
<div style="flex:1;background:var(--info-bg);color:var(--navy-700);display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600;font-size:14px">Info</div>
</div>
